<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurum Velare 3.5</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #06080F;
      color: #C8C0B0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      min-height: 100vh;
    }

    /* ── Variables ── */
    :root {
      --gold:       #C9A84C;
      --gold-dim:   #A07830;
      --gold-glow:  #C9A84C18;
      --bg:         #06080F;
      --bg2:        #0A0C18;
      --bg3:        #0E1020;
      --border:     #1E2238;
      --border-gold:#C9A84C33;
      --text:       #C8C0B0;
      --text-dim:   #9890A0;
      --text-muted: #5A5870;
      --green:      #4ACC8A;
      --red:        #CC4444;
    }

    /* ── Login ── */
    #screen-login {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .login-box {
      background: var(--bg2);
      border: 1px solid var(--border-gold);
      width: 100%;
      max-width: 400px;
      padding: 2.5rem 2rem;
      position: relative;
    }

    .login-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .login-title {
      font-size: 22px;
      color: var(--gold);
      letter-spacing: .3em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: .4rem;
    }

    .login-sub {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      letter-spacing: .15em;
      margin-bottom: 2rem;
    }

    .field-label {
      font-size: 11px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: block;
      margin-bottom: .4rem;
    }

    .field-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .7rem .9rem;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 1.2rem;
    }

    .field-input:focus { border-color: var(--gold); }

    .btn-gold {
      width: 100%;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: .75rem;
      font-size: 13px;
      letter-spacing: .2em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s;
    }

    .btn-gold:hover { background: var(--gold-glow); }

    .login-err {
      font-size: 13px;
      color: var(--red);
      text-align: center;
      min-height: 18px;
      margin-bottom: .8rem;
    }

    /* ── App ── */
    #screen-app { display: none; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .75rem 2rem;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }

    .topbar-logo {
      font-size: 14px;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .topbar-user {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      font-size: 13px;
      color: var(--text-dim);
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: .35rem .9rem;
      font-size: 12px;
      letter-spacing: .1em;
      cursor: pointer;
      font-family: inherit;
      transition: border-color .2s, color .2s;
    }

    .btn-logout:hover { border-color: var(--red); color: var(--red); }

    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
    }

    /* ── Bienvenida usuario normal ── */
    .bienvenida {
      text-align: center;
      padding: 4rem 2rem;
    }

    .bienvenida-titulo {
      font-size: 36px;
      color: var(--gold);
      letter-spacing: .05em;
      margin-bottom: .8rem;
    }

    .bienvenida-sub {
      font-size: 16px;
      color: var(--text-dim);
      line-height: 1.8;
      margin-bottom: 2rem;
    }

    .etapa-badge {
      display: inline-block;
      border: 1px solid var(--border-gold);
      background: var(--gold-glow);
      color: var(--gold);
      padding: .5rem 1.5rem;
      font-size: 13px;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    /* ── Admin panel ── */
    #panel-admin h2 {
      font-size: 18px;
      color: var(--gold);
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      padding-bottom: .8rem;
      border-bottom: 1px solid var(--border);
    }

    #admin-contenedor table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    #admin-contenedor th {
      text-align: left;
      padding: .5rem .8rem;
      font-size: 11px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    #admin-contenedor td {
      padding: .65rem .8rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-dim);
    }

    #admin-contenedor tr:hover td { background: var(--bg3); }

    #admin-contenedor select {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .25rem .5rem;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }

    #admin-contenedor button {
      background: transparent;
      border: 1px solid #CC444433;
      color: var(--red);
      padding: .25rem .7rem;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color .2s;
    }

    #admin-contenedor button:hover { border-color: var(--red); }

    #admin-contenedor hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    #admin-contenedor h3 {
      font-size: 14px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 1rem;
    }

    #admin-form input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .6rem .8rem;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }

    #admin-form input:focus { border-color: var(--gold); }

    #admin-form button {
      background: transparent;
      border: 1px solid var(--border-gold);
      color: var(--gold);
      padding: .6rem;
      font-size: 12px;
      letter-spacing: .15em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s;
    }

    #admin-form button:hover { background: var(--gold-glow); }
  </style>
</head>
<body>

<!-- ══ PANTALLA LOGIN ══════════════════════════════════════ -->
<div id="screen-login">
  <div class="login-box">
    <div class="login-title">Aurum Velare</div>
    <div class="login-sub">Introduce tus credenciales</div>

    <label class="field-label" for="login-email">Email</label>
    <input class="field-input" id="login-email" type="email" placeholder="tu@email.com"
      onkeydown="if(event.key==='Enter') document.getElementById('login-pass').focus()">

    <label class="field-label" for="login-pass">Contraseña</label>
    <input class="field-input" id="login-pass" type="password" placeholder="••••••••"
      onkeydown="if(event.key==='Enter') hacerLogin()">

    <div class="login-err" id="login-err"></div>

    <button class="btn-gold" id="login-btn" onclick="hacerLogin()">✦ Entrar</button>
  </div>
</div>


<!-- ══ PANTALLA APP ════════════════════════════════════════ -->
<div id="screen-app">

  <div class="topbar">
    <div class="topbar-logo">Aurum Velare 3.5</div>
    <div class="topbar-user">
      <span id="topbar-email"></span>
      <button class="btn-logout" onclick="hacerLogout()">Cerrar sesión</button>
    </div>
  </div>

  <div class="main">

    <!-- Panel admin (solo roderastrader@gmail.com) -->
    <div id="panel-admin" style="display:none;">
      <h2>Panel de administración</h2>
      <div id="admin-contenedor"></div>
    </div>

    <!-- Bienvenida usuario normal -->
    <div id="panel-usuario" style="display:none;">
      <div class="bienvenida">
        <div class="bienvenida-titulo">Bienvenido a Aurum</div>
        <div class="bienvenida-sub">
          Has iniciado sesión correctamente.<br>
          Tu proceso comienza aquí.
        </div>
        <div class="etapa-badge">Etapa 0 — Silencio</div>
      </div>
    </div>

  </div>
</div>


<script src="./aurum-3.5/supabase.js"></script>
<script src="./aurum-3.5/auth.js"></script>
<script src="./aurum-3.5/admin.js"></script>
<script>
  const ADMIN_EMAIL = 'roderastrader@gmail.com';

  async function hacerLogin() {
    var email = (document.getElementById('login-email').value || '').trim().toLowerCase();
    var pass  = (document.getElementById('login-pass').value  || '').trim();
    var err   = document.getElementById('login-err');
    var btn   = document.getElementById('login-btn');

    if (!email || !pass) { err.textContent = 'Introduce email y contraseña.'; return; }

    err.textContent = '';
    btn.textContent = 'Entrando...';
    btn.disabled    = true;

    var res = await signInWithPassword(email, pass);

    btn.textContent = '✦ Entrar';
    btn.disabled    = false;

    if (res.error) {
      err.textContent = 'Credenciales incorrectas.';
      return;
    }

    mostrarApp(email);
  }

  function mostrarApp(email) {
    document.getElementById('screen-login').style.display = 'none';
    document.getElementById('screen-app').style.display   = 'block';
    document.getElementById('topbar-email').textContent   = email;

    if (email === ADMIN_EMAIL) {
      document.getElementById('panel-admin').style.display  = 'block';
      document.getElementById('panel-usuario').style.display = 'none';
      adminRenderPanel('admin-contenedor');
    } else {
      document.getElementById('panel-admin').style.display  = 'none';
      document.getElementById('panel-usuario').style.display = 'block';
    }
  }

  async function hacerLogout() {
    await signOut();
    document.getElementById('screen-app').style.display   = 'none';
    document.getElementById('screen-login').style.display = 'flex';
    document.getElementById('login-email').value = '';
    document.getElementById('login-pass').value  = '';
    document.getElementById('login-err').textContent = '';
  }
</script>

</body>
</html>
